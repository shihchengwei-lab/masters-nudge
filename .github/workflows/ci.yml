name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install Pillow
      - name: Verify generated plugin runtime
        run: python tools/build_plugin.py --check
      - name: Smoke-test self-contained plugin package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          smoke_root="$(mktemp -d)"
          plugin_root="$smoke_root/masters-nudge"
          cp -R plugins/masters-nudge "$plugin_root"
          bash -n "$plugin_root/hooks/run_python.sh"

          MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" \
            "$plugin_root/masters_nudge_cli.py" doctor --host all --json \
            > "$smoke_root/doctor.json"
          python -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); assert data["python"]["ready"] and data["data"]["writable"] and not data["runtime"]["missing"]' \
            "$smoke_root/doctor.json"

          printf '%s\n' '{"hook_event_name":"UserPromptSubmit","session_id":"claude-ci","turn_id":"t","cwd":".","prompt":"smoke"}' \
            | MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" "$plugin_root/claude_prompt.py"
          printf '%s\n' '{"hook_event_name":"PostToolUse","session_id":"claude-ci","turn_id":"t","cwd":".","tool_name":"Read","tool_input":{},"tool_response":{}}' \
            | MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" "$plugin_root/claude_checkpoint.py"
          printf '%s\n' '{"hook_event_name":"Stop","session_id":"claude-empty","turn_id":"t","cwd":"."}' \
            | MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" "$plugin_root/claude_stop.py"

          printf '%s\n' '{"hook_event_name":"UserPromptSubmit","session_id":"codex-ci","turn_id":"t","cwd":".","prompt":"smoke"}' \
            | MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" "$plugin_root/hook_entry.py" --host codex_cli
          printf '%s\n' '{"hook_event_name":"PostToolUse","session_id":"codex-ci","turn_id":"t","cwd":".","tool_name":"Read","tool_input":{},"tool_response":{}}' \
            | MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" "$plugin_root/hook_entry.py" --host codex_cli
          printf '%s\n' '{"hook_event_name":"Stop","session_id":"codex-empty","turn_id":"t","cwd":"."}' \
            | MASTERS_NUDGE_DATA_DIR="$smoke_root/data" sh "$plugin_root/hooks/run_python.sh" "$plugin_root/hook_entry.py" --host codex_cli

          test "$(find "$smoke_root/data" -type f -name '*.turn.json' | wc -l | tr -d ' ')" = "2"
      - name: Smoke-test self-contained plugin package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          $pluginRoot = Join-Path $smokeRoot "masters-nudge"
          $dataRoot = Join-Path $smokeRoot "data"
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Copy-Item -LiteralPath ./plugins/masters-nudge -Destination $pluginRoot -Recurse
          $env:MASTERS_NUDGE_DATA_DIR = $dataRoot

          $doctorPath = Join-Path $smokeRoot "doctor.json"
          & "$pluginRoot\hooks\run_python.cmd" `
            "$pluginRoot\masters_nudge_cli.py" doctor --host all --json `
            | Set-Content -LiteralPath $doctorPath -Encoding utf8
          $doctor = Get-Content -Raw -LiteralPath $doctorPath | ConvertFrom-Json
          if (-not $doctor.python.ready -or -not $doctor.data.writable -or $doctor.runtime.missing.Count -ne 0) {
            throw "Copied plugin package is not self-contained"
          }

          @{hook_event_name="UserPromptSubmit"; session_id="claude-ci"; turn_id="t"; cwd="."; prompt="smoke"} `
            | ConvertTo-Json -Compress `
            | & "$pluginRoot\hooks\run_python.cmd" "$pluginRoot\claude_prompt.py"
          @{hook_event_name="PostToolUse"; session_id="claude-ci"; turn_id="t"; cwd="."; tool_name="Read"; tool_input=@{}; tool_response=@{}} `
            | ConvertTo-Json -Compress `
            | & "$pluginRoot\hooks\run_python.cmd" "$pluginRoot\claude_checkpoint.py"
          @{hook_event_name="Stop"; session_id="claude-empty"; turn_id="t"; cwd="."} `
            | ConvertTo-Json -Compress `
            | & "$pluginRoot\hooks\run_python.cmd" "$pluginRoot\claude_stop.py"

          @{hook_event_name="UserPromptSubmit"; session_id="codex-ci"; turn_id="t"; cwd="."; prompt="smoke"} `
            | ConvertTo-Json -Compress `
            | & "$pluginRoot\hooks\run_python.cmd" "$pluginRoot\hook_entry.py" --host codex_cli
          @{hook_event_name="PostToolUse"; session_id="codex-ci"; turn_id="t"; cwd="."; tool_name="Read"; tool_input=@{}; tool_response=@{}} `
            | ConvertTo-Json -Compress `
            | & "$pluginRoot\hooks\run_python.cmd" "$pluginRoot\hook_entry.py" --host codex_cli
          @{hook_event_name="Stop"; session_id="codex-empty"; turn_id="t"; cwd="."} `
            | ConvertTo-Json -Compress `
            | & "$pluginRoot\hooks\run_python.cmd" "$pluginRoot\hook_entry.py" --host codex_cli

          $turnFiles = @(Get-ChildItem -LiteralPath $dataRoot -Recurse -File -Filter *.turn.json)
          if ($turnFiles.Count -ne 2) {
            throw "Expected two host-namespaced turn states, found $($turnFiles.Count)"
          }
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run full test suite
        run: python -m unittest discover -v
